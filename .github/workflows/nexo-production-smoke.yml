name: NEXO Production Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexo-production-final-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Static production smoke
        run: node scripts/nexo-smoke.mjs

      - name: Selector safety
        run: node scripts/nexo-selector-safety.mjs

      - name: Architecture / bundle budget
        run: node scripts/nexo-architecture-budget.mjs

      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - name: Serve static app
        run: |
          python3 -m http.server 4173 >/tmp/nexo-http.log 2>&1 &
          echo $! > /tmp/nexo-http.pid
          sleep 2

      - name: HTTP shell smoke
        run: |
          curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/app.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/assets/nexo-v13-hardening.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/assets/nexo-v13-ui.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/assets/nexo-v13-search-errors.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/sw.js >/dev/null

      - name: Interaction performance budget
        run: node scripts/nexo-interaction-budget.mjs

      - name: Resilience smoke
        run: node scripts/nexo-resilience-smoke.mjs

      - name: Phase 2 core UX smoke
        run: node scripts/nexo-phase2-ux-smoke.mjs

      - name: Cross-browser mobile smoke
        run: node scripts/nexo-phase2-browser-compat.mjs

      - name: Browser runtime smoke
        run: node scripts/nexo-browser-smoke.mjs

      - name: Upload visual reference screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-visual-reference-${{ github.sha }}
          path: artifacts/visual
          if-no-files-found: warn
          retention-days: 14

      - name: Build Cloudflare asset bundle
        if: github.event_name != 'pull_request'
        run: |
          rm -rf dist
          mkdir -p dist
          cp index.html styles.css app.js sw.js manifest.webmanifest dist/
          cp folha-redacao-enem.html privacidade.html termos.html dist/
          cp -R assets dist/assets

      - name: Check Cloudflare deploy credentials
        id: cloudflare
        if: github.event_name != 'pull_request'
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_ACCOUNT" ] && [ -n "$CF_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deploy credentials available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare deploy skipped: repository secrets CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN are not configured."
          fi

      - name: Deploy current main to Cloudflare Worker
        if: github.event_name != 'pull_request' && steps.cloudflare.outputs.available == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Public Cloudflare runtime smoke
        if: github.event_name != 'pull_request' && steps.cloudflare.outputs.available == 'true'
        run: node scripts/nexo-live-smoke.mjs
